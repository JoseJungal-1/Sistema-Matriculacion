spring.application.name=matriculacion

spring.datasource.url=jdbc:mysql://localhost:3306/matriculacion
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=8083

# Debe definirse fuera del repositorio. Debe ser Base64 y representar al menos 32 bytes.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000
app.seed.admin-password=${ADMIN_PASSWORD}
